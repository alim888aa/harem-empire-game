<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Touch viewport QA</title>
<style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#102027;color:#f8ecd1;font:14px/1.5 system-ui,sans-serif}header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}strong{margin-right:12px}button{border:1px solid #bba878;border-radius:6px;background:#243c43;color:#fff2d2;padding:10px 14px;min-height:44px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#e5ce95;color:#1d373e}p{margin:0 0 12px;color:#c6d8d8}iframe{display:block;border:0;background:#18332c;box-shadow:0 0 0 1px #9fb2b8;margin:0 auto}#size{color:#f0d6a4;font-weight:600}</style></head>
<body><header><strong>Isolated touch-layout QA</strong><button data-size="393,852" aria-pressed="true">Phone portrait</button><button data-size="812,375" aria-pressed="false">Phone landscape</button><button data-size="768,1024" aria-pressed="false">Tablet portrait</button><button data-size="1024,768" aria-pressed="false">Tablet landscape</button><button data-size="568,320" aria-pressed="false">Small landscape</button></header>
<p><span id="size">393 × 852 CSS px</span> · Software renderer and separate fictional save slot · This checks layout, not physical touch hardware or GPU graphics</p>
<iframe title="Isolated game touch viewport" width="393" height="852" src="/?playtest=intrigue&amp;renderer=software&amp;controls=touch&amp;frame=touch-viewport"></iframe>
<script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{const [width,height]=button.dataset.size.split(',').map(Number);frame.width=width;frame.height=height;document.querySelectorAll('[data-size]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));document.querySelector('#size').textContent=`${width} × ${height} CSS px`;}));</script></body></html>
